spring.application.name=banking-service


spring.datasource.url=jdbc:mysql://${DB_HOST:172.21.80.1}:${DB_PORT:3306}/${DB_NAME:banking_db}
spring.datasource.username=${BANKING_DB_USERNAME:banking_user}
spring.datasource.password=${BANKING_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

server.port=8282

#spring.application.name=banking-service


eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

debug=false
logging.level.org.springframework.boot.autoconfigure.batch=WARN

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

spring.kafka.consumer.group-id=banking-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.infy.bankingApplication.entity

spring.kafka.producer.properties.spring.json.add.type.headers=false


spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Outbox event cleanup configuration

# Retain published events for 30 days
outbox.cleanup.retention-days=30

# Run cleanup every 24 hours (milliseconds)
outbox.cleanup.fixed-delay=86400000

app.jwt.secret=${BANKING_JWT_SECRET}${BANKING_JWT_SECRET}
management.endpoint.health.show-details=when-authorized
